[variables]
NIXPACKS_PHP_EXTENSIONS = "intl zip gd pdo_mysql mbstring openssl"

[phases.build]
cmds = [
  "composer install --optimize-autoloader --no-scripts --no-interaction",
  "npm install",
  "npm run build"
]

[start]
cmd = "php artisan storage:link --force && php artisan serve --host=0.0.0.0 --port=$PORT"
