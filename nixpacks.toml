[providers]
providers = ["php", "node"]

[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nodejs_22"]

[phases.build]
cmds = [
  "composer install --ignore-platform-reqs --no-dev --optimize-autoloader",
  "npm ci || npm install",
  "npm run build"
]

[start]
cmd = "php artisan storage:link --force && php artisan serve --host=0.0.0.0 --port=$PORT"
